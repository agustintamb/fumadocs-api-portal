openapi: 3.0.3
info:
  title: Blog API
  description: |
    REST API for managing blog posts, comments, and authors.
    Supports full CRUD operations with pagination and filtering.
  version: 1.0.0
  contact:
    name: Blog Team
    email: blog@example.com

servers:
  - url: https://api.example.com/blog/v1
    description: Production
  - url: https://staging-api.example.com/blog/v1
    description: Staging

tags:
  - name: posts
    description: Blog post operations
  - name: comments
    description: Comment operations on posts
  - name: authors
    description: Author profile management

paths:
  /posts:
    get:
      tags: [posts]
      summary: List all posts
      description: Returns a paginated list of blog posts with optional filtering.
      operationId: listPosts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: tag
          in: query
          schema:
            type: string
        - name: authorId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, archived]
      responses:
        "200":
          description: Paginated list of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Post"
                  total:
                    type: integer
                    example: 42
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
    post:
      tags: [posts]
      summary: Create a post
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePost"
            example:
              title: "Getting Started with APIs"
              content: "This is a comprehensive guide..."
              tags: ["api", "tutorial"]
              status: "draft"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: "post_abc123"
    get:
      tags: [posts]
      summary: Get a post
      operationId: getPost
      responses:
        "200":
          description: Post found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [posts]
      summary: Update a post
      operationId: updatePost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePost"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [posts]
      summary: Delete a post
      operationId: deletePost
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Post deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [comments]
      summary: List post comments
      operationId: getPostComments
      responses:
        "200":
          description: Comments for the post
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [comments]
      summary: Add a comment
      operationId: addComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComment"
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /authors:
    get:
      tags: [authors]
      summary: List authors
      operationId: listAuthors
      responses:
        "200":
          description: List of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Author"

  /authors/{id}:
    get:
      tags: [authors]
      summary: Get an author
      operationId: getAuthor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Author profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
        "404":
          $ref: "#/components/responses/NotFound"

  /authors/{id}/posts:
    get:
      tags: [authors]
      summary: Get author posts
      operationId: getAuthorPosts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Posts by this author
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

components:
  schemas:
    Post:
      type: object
      required: [id, title, content, author, status, createdAt]
      properties:
        id:
          type: string
          example: "post_abc123"
        title:
          type: string
          example: "Getting Started with APIs"
        content:
          type: string
        excerpt:
          type: string
        author:
          $ref: "#/components/schemas/Author"
        tags:
          type: array
          items:
            type: string
          example: ["api", "tutorial"]
        status:
          type: string
          enum: [draft, published, archived]
          example: "published"
        readTimeMinutes:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePost:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, published]
          default: draft

    Comment:
      type: object
      required: [id, postId, author, content, createdAt]
      properties:
        id:
          type: string
          example: "comment_xyz789"
        postId:
          type: string
        author:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
        content:
          type: string
          example: "Great post!"
        createdAt:
          type: string
          format: date-time

    CreateComment:
      type: object
      required: [author, content]
      properties:
        author:
          type: string
        email:
          type: string
          format: email
        content:
          type: string
          maxLength: 2000

    Author:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          example: "author_def456"
        name:
          type: string
          example: "Jane Smith"
        bio:
          type: string
        email:
          type: string
          format: email
        avatar:
          type: string
          format: uri
        postsCount:
          type: integer
          example: 12

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "NOT_FOUND"
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
