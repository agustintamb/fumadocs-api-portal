openapi: 3.0.3
info:
  title: Blog API
  description: |
    REST API for managing blog posts, comments, and authors.

    **v2 changes from v1:**
    - `Post` now includes `coverImage`, `slug`, and `likes` fields
    - New endpoint: `POST /posts/{id}/like` — like/unlike a post
    - New endpoint: `GET /posts/featured` — curated featured posts
    - `CreatePost` accepts `coverImage` and `slug`
    - Comments now support nested replies via `parentId`
    - `Author` includes `socialLinks` map
    - `GET /posts` adds `search` query param for full-text search
  version: 2.0.0
  contact:
    name: Blog Team
    email: blog@example.com

servers:
  - url: https://api.example.com/blog/v2
    description: Production
  - url: https://staging-api.example.com/blog/v2
    description: Staging

tags:
  - name: posts
    description: Blog post operations
  - name: comments
    description: Comment operations on posts
  - name: authors
    description: Author profile management

paths:
  /posts:
    get:
      tags: [posts]
      summary: List all posts
      description: Returns a paginated list of blog posts with optional filtering and full-text search.
      operationId: listPosts
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: tag
          in: query
          schema:
            type: string
        - name: authorId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, archived]
        - name: search
          in: query
          description: Full-text search across title and content (v2)
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Post"
                  total:
                    type: integer
                    example: 42
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
    post:
      tags: [posts]
      summary: Create a post
      operationId: createPost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePost"
            example:
              title: "Getting Started with APIs"
              content: "This is a comprehensive guide..."
              slug: "getting-started-with-apis"
              tags: ["api", "tutorial"]
              status: "draft"
              coverImage: "https://cdn.example.com/covers/apis.jpg"
      responses:
        "201":
          description: Post created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /posts/featured:
    get:
      tags: [posts]
      summary: Get featured posts
      description: Returns a curated list of featured posts (v2 only).
      operationId: getFeaturedPosts
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: List of featured posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

  /posts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          example: "post_abc123"
    get:
      tags: [posts]
      summary: Get a post
      operationId: getPost
      responses:
        "200":
          description: Post found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [posts]
      summary: Update a post
      operationId: updatePost
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePost"
      responses:
        "200":
          description: Post updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Post"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [posts]
      summary: Delete a post
      operationId: deletePost
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Post deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/like:
    post:
      tags: [posts]
      summary: Like or unlike a post
      description: Toggles the like state for the authenticated user (v2 only).
      operationId: likePost
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Like state toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked:
                    type: boolean
                  likes:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /posts/{id}/comments:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [comments]
      summary: List post comments
      operationId: getPostComments
      responses:
        "200":
          description: Comments for the post (v2 supports nested replies via parentId)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [comments]
      summary: Add a comment
      operationId: addComment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateComment"
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /authors:
    get:
      tags: [authors]
      summary: List authors
      operationId: listAuthors
      responses:
        "200":
          description: List of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Author"

  /authors/{id}:
    get:
      tags: [authors]
      summary: Get an author
      operationId: getAuthor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Author profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Author"
        "404":
          $ref: "#/components/responses/NotFound"

  /authors/{id}/posts:
    get:
      tags: [authors]
      summary: Get author posts
      operationId: getAuthorPosts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Posts by this author
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Post"

components:
  schemas:
    Post:
      type: object
      required: [id, title, content, slug, author, status, createdAt]
      properties:
        id:
          type: string
          example: "post_abc123"
        title:
          type: string
          example: "Getting Started with APIs"
        slug:
          type: string
          description: URL-friendly identifier (v2)
          example: "getting-started-with-apis"
        content:
          type: string
        excerpt:
          type: string
        coverImage:
          type: string
          format: uri
          description: Cover image URL (v2)
          example: "https://cdn.example.com/covers/apis.jpg"
        author:
          $ref: "#/components/schemas/Author"
        tags:
          type: array
          items:
            type: string
          example: ["api", "tutorial"]
        status:
          type: string
          enum: [draft, published, archived]
          example: "published"
        likes:
          type: integer
          description: Total like count (v2)
          example: 47
        readTimeMinutes:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreatePost:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        slug:
          type: string
          description: Custom slug (auto-generated from title if omitted) (v2)
          pattern: "^[a-z0-9-]+$"
        content:
          type: string
        coverImage:
          type: string
          format: uri
          description: Cover image URL (v2)
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [draft, published]
          default: draft

    Comment:
      type: object
      required: [id, postId, author, content, createdAt]
      properties:
        id:
          type: string
          example: "comment_xyz789"
        postId:
          type: string
        parentId:
          type: string
          nullable: true
          description: Parent comment ID for nested replies (v2)
          example: "comment_abc123"
        author:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
        content:
          type: string
          example: "Great post!"
        createdAt:
          type: string
          format: date-time

    CreateComment:
      type: object
      required: [author, content]
      properties:
        author:
          type: string
        email:
          type: string
          format: email
        content:
          type: string
          maxLength: 2000
        parentId:
          type: string
          nullable: true
          description: Reply to another comment (v2)

    Author:
      type: object
      required: [id, name, email]
      properties:
        id:
          type: string
          example: "author_def456"
        name:
          type: string
          example: "Jane Smith"
        bio:
          type: string
        email:
          type: string
          format: email
        avatar:
          type: string
          format: uri
        postsCount:
          type: integer
          example: 12
        socialLinks:
          type: object
          description: Social media links keyed by platform name (v2)
          additionalProperties:
            type: string
            format: uri
          example:
            twitter: "https://twitter.com/janesmith"
            github: "https://github.com/janesmith"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "NOT_FOUND"
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
